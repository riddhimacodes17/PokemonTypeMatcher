<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="header">
        <img src="pokemonball.jpg" alt="pokemon-ball" class="pokiball">
        <img src="pikachuface.jpg" id="pikachu-small">
    </div>
    <div class="middle">
        <img src="pokemontext.jpg" alt="pokemon-text" id="pokemon-logo">
        <h1>TYPE QUIZ</h1>
        <img src="pikachu.png" id="pikachu-big">
        <div class="buttons">
            <button id="start">
                <img src="pokemonball.jpg" alt="pokemon-logo" class="pokiball"> START QUIZ
            </button>
            <button id="score">📋 VIEW PREVIOUS SCORES</button>
        </div>
    </div>
    <div class="footer">
        <img src="pokemonball.jpg" alt="pokemon-logo" class="pokiball">
        <p>@Pokemon Type Quiz</p>
        </div>

  <script>
    const startBtn=document.getElementById("start");
    const scoreBtn=document.getElementById("score");

    startBtn.addEventListener("click", function() {
        window.location.href="quiz.html";
    });

    scoreBtn.addEventListener("click", function() {
        window.location.href="scores.html";
    });
   </script>
</body>
</html>
