<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Page</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <div class="navbar">
        <button id="backBtn">←</button>
        <h2>Pokemon Type Quiz</h2>
    </div>
     
    <div class="progress-text">
            <span id="questionText">Question 1 / 10</span>
            <span id="score">Score: 0</span>
    </div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar">
            <img src="pokemonball.jpg" id="pokiball">
        </div>
    </div>

    <div class="question-container">
        <h2>What is the primary type of this pokemon?</h2>
        <img id="pokemonImage" alt="Pokemon">
        <div class="options-block1">
            <button id="optionA" class="optionBtn"></button>
            <button id="optionB" class="optionBtn"></button>
        </div>
        <div class="options-block2">
            <button id="optionC" class="optionBtn"></button>
            <button id="optionD" class="optionBtn"></button>
        </div>
    </div>
    <div id="toast"></div>
    <script src="quiz.js"></script>
</body>
</html>
