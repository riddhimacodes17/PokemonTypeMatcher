<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Page</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <div class="navbar">
        <button id="backBtn">←</button>
        <h2>Pokemon Type Quiz</h2>
    </div>
     
    <div class="progress-text">
            <span id="questionNo">Question 1 / 10</span>
            <span id="score">Score: 0</span>
    </div>
    <div class="progress-container">
        <div class="progress-bar">
            <img src="pokemonball.jpg" id="pokiball">
        </div>
    </div>

    <div class="question-container">
        <h2>What is the primary type of this pokemon?</h2>
        <img src ="pikachu.png" id="pokemonimg">
        <div class="options-block1">
            <button id="optionA"></button>
            <button id="optionB"></button>
        </div>
        <div class="options-block2">
            <button id="optionC"></button>
            <button id="optionD"></button>
        </div>
    </div>
    
</body>
</html>
